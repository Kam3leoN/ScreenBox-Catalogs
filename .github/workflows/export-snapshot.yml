name: Export Turso snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH
      - name: Dump database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "TURSO secrets missing — skip"
            exit 0
          fi
          # Placeholder: dump via turso db shell when DB name configured
          echo "Configure turso dump → screenbox-catalogs.db"
      - name: Commit snapshot
        run: |
          if [ ! -f screenbox-catalogs.db ]; then
            echo "No db to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenbox-catalogs.db
          git diff --staged --quiet || git commit -m "chore: export catalogs snapshot"
          git push
